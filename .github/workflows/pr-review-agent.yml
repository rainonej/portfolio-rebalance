name: PR Review Agent

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review-failures:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get workflow run info and analyze failure
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is a PR workflow run
            const prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!prNumber) {
              console.log('No PR associated with this workflow run, skipping review');
              return;
            }

            // Get failed jobs and steps
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            let failedJob = null;
            let failedStep = null;
            let logExcerpt = '';

            // Find first failed job and step
            for (const job of jobs.jobs || []) {
              if (job.conclusion === 'failure') {
                failedJob = job;
                const { data: steps } = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.payload.workflow_run.id,
                  attempt_number: job.run_attempt || 1,
                });

                for (const step of steps.steps || []) {
                  if (step.conclusion === 'failure') {
                    failedStep = step;
                    // Try to get log excerpt from the failed step
                    // Note: getWorkflowRunAttemptLogs returns a download URL, not content
                    // We'll reference the workflow run URL instead
                    break;
                  }
                }
                break;
              }
            }

            if (!failedJob || !failedStep) {
              console.log('Could not identify failed job/step');
              return;
            }

            // Build analysis
            let analysis = `## 🔍 CI Failure Analysis\n\n`;
            analysis += `**Failed Job:** \`${failedJob.name}\`\n`;
            analysis += `**Failed Step:** \`${failedStep.name}\`\n\n`;

            // Pattern matching for common issues
            let hypothesis = '';
            let proposedFix = '';

            const stepName = failedStep.name || '';

            if (stepName.includes('Ruff format')) {
              hypothesis = '**Hypothesis:** Code formatting does not match Ruff\'s expected format. This usually happens when code is edited without running `ruff format` before committing.';
              proposedFix = `**Proposed Fix:**\n\`\`\`bash\nruff format .\n\`\`\`\n\nThen commit the formatted files:\n\`\`\`bash\ngit add .\ngit commit --amend --no-edit\n\`\`\``;
            } else if (stepName.includes('Ruff lint')) {
              hypothesis = '**Hypothesis:** Code has linting errors (style, import order, or code quality issues).';
              proposedFix = `**Proposed Fix:**\n\`\`\`bash\nruff check --fix .\n\`\`\`\n\nReview and commit the fixes.`;
            } else if (stepName.includes('Pyright')) {
              hypothesis = '**Hypothesis:** Type checking errors detected. This could be missing type hints, incorrect types, or type mismatches.';
              proposedFix = `**Proposed Fix:**\n1. Review the Pyright output for specific type errors\n2. Add missing type hints\n3. Fix type mismatches\n4. Run \`pyright\` locally to verify`;
            } else if (stepName.includes('Pytest')) {
              hypothesis = '**Hypothesis:** Tests are failing. This could be due to broken functionality, changed interfaces, or test environment issues.';
              proposedFix = `**Proposed Fix:**\n1. Run tests locally: \`pytest\`\n2. Review test failures\n3. Fix the underlying issues\n4. Ensure all tests pass before pushing`;
            } else {
              hypothesis = '**Hypothesis:** Unknown failure. Review the logs below for details.';
              proposedFix = `**Proposed Fix:**\n1. Review the full workflow logs\n2. Reproduce the issue locally\n3. Fix the underlying problem`;
            }

            analysis += hypothesis + '\n\n';
            analysis += proposedFix + '\n\n';
            analysis += `### 📋 Full Logs\n\n`;
            analysis += `View the complete logs in the [workflow run](${context.payload.workflow_run.html_url}).\n`;

            // Post comment to PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: analysis,
            });

            console.log(`Posted failure analysis to PR #${prNumber}`);
