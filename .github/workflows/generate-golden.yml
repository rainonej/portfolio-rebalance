name: Generate Golden Data

on:
  workflow_dispatch:

jobs:
  generate-golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate golden file
        run: python scripts/generate_golden.py

      - name: Upload golden artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-golden
          path: tests/data/golden/stooq_aapl_2010_01_04_2010_01_08.csv
