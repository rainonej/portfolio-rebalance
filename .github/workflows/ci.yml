name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (auto-fix if needed)
        shell: bash
        run: |
          set -euo pipefail
          if ruff check .; then
            echo "Ruff check passed."
          else
            echo "Ruff check failed; attempting auto-fix."
            ruff check --fix .
            ruff format .
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add .
              git commit -m "Apply ruff auto-fixes"
              git push
            else
              echo "No changes after auto-fix."
            fi
          fi

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest

  paper-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/paper
          cp paper/main.pdf site/paper/main.pdf

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: paper-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
