name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  # paper-build job needs write to commit PDF updates

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check . || (echo "::error::Formatting check failed. Run 'ruff format .' locally to fix." && exit 1)

      - name: Ruff lint
        run: ruff check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest

  paper-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for paper changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            paper:
              - 'paper/**/*.tex'
              - 'paper/**/*.bib'
              - 'paper/**/*.cls'
              - 'paper/**/*.sty'
              - 'paper/**/*.bst'
              - 'paper/README.md'

      - name: Build paper
        if: steps.filter.outputs.paper == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      - name: Commit PDF if changed
        if: steps.filter.outputs.paper == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Check if PDF has changed compared to HEAD
          if ! git diff --exit-code HEAD -- paper/main.pdf > /dev/null 2>&1; then
            echo "PDF has changed, committing update to current branch"
            git add paper/main.pdf
            git commit -m "chore: update paper PDF [skip ci]"
            git push
          else
            echo "PDF unchanged, skipping commit"
          fi

      - name: Prepare Pages artifact
        if: steps.filter.outputs.paper == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/paper
          cp paper/main.pdf site/paper/main.pdf
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Portfolio Foundation</title>
            <meta http-equiv="refresh" content="0; url=paper/main.pdf">
            <link rel="canonical" href="paper/main.pdf">
          </head>
          <body>
            <p>Redirecting to <a href="paper/main.pdf">paper/main.pdf</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: steps.filter.outputs.paper == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload PDF
        if: steps.filter.outputs.paper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.paper-build.result == 'success' || needs.paper-build.result == 'skipped')
    needs: paper-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pr-review-agent:
    if: always() && github.event_name == 'pull_request' && (needs.python-checks.result == 'failure' || needs.paper-build.result == 'failure')
    needs: [python-checks, paper-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Analyze failure and post comment
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR number
            const prNumber = context.payload.pull_request?.number || context.payload.number;
            if (!prNumber) {
              console.log('Not a PR event, skipping review');
              return;
            }

            // Get failed jobs
            const failedJobs = [];
            if ('${{ needs.python-checks.result }}' === 'failure') {
              failedJobs.push('python-checks');
            }
            if ('${{ needs.paper-build.result }}' === 'failure') {
              failedJobs.push('paper-build');
            }

            if (failedJobs.length === 0) {
              console.log('No failed jobs to analyze');
              return;
            }

            // Get workflow run details
            const workflowRunId = context.runId;
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRunId,
            });

            let failedJob = null;
            let failedStep = null;

            // Find first failed job and step
            for (const job of jobs.jobs || []) {
              if (job.conclusion === 'failure' && failedJobs.includes(job.name)) {
                failedJob = job;
                const { data: steps } = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: workflowRunId,
                  attempt_number: job.run_attempt || 1,
                });

                for (const step of steps.steps || []) {
                  if (step.conclusion === 'failure') {
                    failedStep = step;
                    break;
                  }
                }
                break;
              }
            }

            if (!failedJob || !failedStep) {
              console.log('Could not identify failed job/step');
              return;
            }

            // Build analysis
            let analysis = `## 🔍 CI Failure Analysis\n\n`;
            analysis += `**Failed Job:** \`${failedJob.name}\`\n`;
            analysis += `**Failed Step:** \`${failedStep.name}\`\n\n`;

            // Pattern matching for common issues
            let hypothesis = '';
            let proposedFix = '';

            const stepName = failedStep.name || '';

            if (stepName.includes('Ruff format')) {
              hypothesis = '**Hypothesis:** Code formatting does not match Ruff\'s expected format. This usually happens when code is edited without running `ruff format` before committing.';
              proposedFix = `**Proposed Fix:**\n\`\`\`bash\nruff format .\n\`\`\`\n\nThen commit the formatted files:\n\`\`\`bash\ngit add .\ngit commit --amend --no-edit\n\`\`\``;
            } else if (stepName.includes('Ruff lint')) {
              hypothesis = '**Hypothesis:** Code has linting errors (style, import order, or code quality issues).';
              proposedFix = `**Proposed Fix:**\n\`\`\`bash\nruff check --fix .\n\`\`\`\n\nReview and commit the fixes.`;
            } else if (stepName.includes('Pyright')) {
              hypothesis = '**Hypothesis:** Type checking errors detected. This could be missing type hints, incorrect types, or type mismatches.';
              proposedFix = `**Proposed Fix:**\n1. Review the Pyright output for specific type errors\n2. Add missing type hints\n3. Fix type mismatches\n4. Run \`pyright\` locally to verify`;
            } else if (stepName.includes('Pytest')) {
              hypothesis = '**Hypothesis:** Tests are failing. This could be due to broken functionality, changed interfaces, or test environment issues.';
              proposedFix = `**Proposed Fix:**\n1. Run tests locally: \`pytest\`\n2. Review test failures\n3. Fix the underlying issues\n4. Ensure all tests pass before pushing`;
            } else {
              hypothesis = '**Hypothesis:** Unknown failure. Review the logs below for details.';
              proposedFix = `**Proposed Fix:**\n1. Review the full workflow logs\n2. Reproduce the issue locally\n3. Fix the underlying problem`;
            }

            analysis += hypothesis + '\n\n';
            analysis += proposedFix + '\n\n';
            analysis += `### 📋 Full Logs\n\n`;
            analysis += `View the complete logs in the [workflow run](${context.payload.repository.html_url}/actions/runs/${workflowRunId}).\n`;

            // Post comment to PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: analysis,
            });

            console.log(`Posted failure analysis to PR #${prNumber}`);
