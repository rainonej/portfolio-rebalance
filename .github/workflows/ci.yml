name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  # paper-build job needs write to commit PDF updates

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check . || (echo "::error::Formatting check failed. Run 'ruff format .' locally to fix." && exit 1)

      - name: Ruff lint
        run: ruff check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest

  paper-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for paper changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            paper:
              - 'paper/**/*.tex'
              - 'paper/**/*.bib'
              - 'paper/**/*.cls'
              - 'paper/**/*.sty'
              - 'paper/**/*.bst'
              - 'paper/README.md'

      - name: Build paper
        if: steps.filter.outputs.paper == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      - name: Commit PDF if changed
        if: steps.filter.outputs.paper == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Check if PDF has changed compared to HEAD
          if ! git diff --exit-code HEAD -- paper/main.pdf > /dev/null 2>&1; then
            echo "PDF has changed, committing update to current branch"
            git add paper/main.pdf
            git commit -m "chore: update paper PDF [skip ci]"
            git push
          else
            echo "PDF unchanged, skipping commit"
          fi

      - name: Prepare Pages artifact
        if: steps.filter.outputs.paper == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/paper
          cp paper/main.pdf site/paper/main.pdf
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Portfolio Foundation</title>
            <meta http-equiv="refresh" content="0; url=paper/main.pdf">
            <link rel="canonical" href="paper/main.pdf">
          </head>
          <body>
            <p>Redirecting to <a href="paper/main.pdf">paper/main.pdf</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: steps.filter.outputs.paper == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload PDF
        if: steps.filter.outputs.paper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.paper-build.result == 'success' || needs.paper-build.result == 'skipped')
    needs: paper-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
