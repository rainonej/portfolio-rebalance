[project]
name = "portfolio-rebalance"
version = "0.1.0"
description = "Portfolio foundation model training for context-only pretraining and asset fine-tuning."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Portfolio Foundation Contributors" }]
dependencies = [
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pyarrow>=17.0.0",
  "PyYAML>=6.0.0",
  "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pyright>=1.1.370",
  "pytest>=8.2.0",
  "pytest-xdist>=3.6.0",
  "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vra --color=yes"
pythonpath = ["src"]
