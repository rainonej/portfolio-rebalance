# Configuration for fetching 100 assets with 10 years of data
# Date range: 10 years prior to 2025-12-12
provider: stooq
frequency: daily
assets_source: configs/data/asset_universe_100.yaml
start_date: 2015-12-12
end_date: 2025-12-12
output_path: artifacts/data/stooq_daily_100.parquet
cache_dir: artifacts/data/cache
use_cache: true
force_refresh: false
